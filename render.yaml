services:
  - type: web
    name: codeflow
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run lint && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: DATA_DIR
        value: /tmp/codeflow-data
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
